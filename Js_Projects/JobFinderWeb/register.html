<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Register | JobFinder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="index.html" class="logo"><span class="logo-icon">J</span><span>JobFinder</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html">Jobs</a></li>
                <li><a href="index.html#companies">Companies</a></li>
                <li><a href="saved.html">Saved</a></li>
                <li class="mobile-only"><a href="login.html">Login</a></li>
                <li class="mobile-only"><a href="register.html">Register</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="login-btn">Login</a>
                <a href="register.html" class="register-btn">Register</a>
                <button type="button" class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
            </div>
            <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="navLinks">☰</button>
        </nav>
    </header>
    <main>
        <section class="auth-section">
            <div class="auth-card">
                <h1>Create Account</h1>
                <p class="auth-sub">Join JobFinder and save jobs you like.</p>
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                          <input type="text" id="regName" autocomplete="name" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" autocomplete="new-password" placeholder="At least 6 characters" required>
                    </div>
                    <div class="form-group">
                        <label for="regConfirm">Confirm Password</label>
                        <input type="password" id="regConfirm" autocomplete="new-password" placeholder="Repeat password" required>
                    </div>
                    <p class="form-error" id="formError" role="alert"></p>
                    <button type="submit" class="register-btn btn-block">Create Account</button>
                </form>
                <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-bottom"><div class="container">
            <p>© 2026 JobFinder. All rights reserved. Job data by <a href="https://remotive.com" target="_blank" rel="noopener noreferrer">Remotive</a>.</p>
        </div></div>
    </footer>
    <script src="app.js"></script>
</body>
</html>
